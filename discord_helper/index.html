<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Processing Tool</title>
    <link rel="stylesheet" href="app/app.css">
</head>
<body>
    <div class="container">
        <h1>Text Processing Tool</h1>
        
        <div class="panel">
            <h2>Input</h2>
            <div class="form-group">
                <label for="inputText">Enter your text:</label>
                <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="toolSelect">Choose a tool:</label>
                <select id="toolSelect">
                    <option value="uppercase">Convert to Uppercase</option>
                    <option value="lowercase">Convert to Lowercase</option>
                    <option value="reverse">Reverse Text</option>
                    <!-- More options can be added here -->
                </select>
            </div>
            
            <div class="button-group">
                <button id="generateBtn" class="generate-btn">Generate</button>
                <button id="resetBtn" class="reset-btn">Reset</button>
            </div>
        </div>
        
        <div class="panel">
            <h2>Output</h2>
            <div class="form-group">
                <label for="outputText">Generated text:</label>
                <textarea id="outputText" readonly></textarea>
            </div>
            
            <div class="button-group">
                <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
            </div>
        </div>
        
        <div class="panel future-components">
            <p>Space for additional components</p>
        </div>
    </div>

    <!-- React root for TextCodeGenerator -->
    <div id="root"></div>
    <!-- Load React and Babel (for development/demo only) -->
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Load TextCodeGenerator component -->
    <script type="text/babel" src="app/text-code-generator.js"></script>
    <script type="text/babel">
      ReactDOM.render(
        <TextCodeGenerator />, 
        document.getElementById('root')
      );
    </script>
</body>
</html></div></select></div>
